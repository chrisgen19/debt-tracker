name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # `prisma generate` runs on postinstall and reads DATABASE_URL through
    # prisma.config.ts. It never opens a connection, so a placeholder is enough.
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Coolify's own auto-deploy is turned off for this app, so `main` reaches
  # production only through this job, which runs only after verify passes.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          status=$(curl -sS -o body.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$WEBHOOK")
          cat body.json
          echo
          test "$status" = "200" || { echo "Coolify returned HTTP $status"; exit 1; }
